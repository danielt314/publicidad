<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LuxuryStay Colombia</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#050505;
color:white;
}

/* NAV */
nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
background:rgba(0,0,0,.6);
backdrop-filter:blur(20px);
z-index:999;
}

nav input{
padding:10px;
border-radius:20px;
border:none;
width:220px;
}

/* HERO */
.hero{
height:70vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:url('https://images.unsplash.com/photo-1566073771259-6a8506099945');
background-size:cover;
background-position:center;
}

.hero h1{
font-size:60px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:20px;
padding:30px;
}

.card{
background:#111;
border-radius:20px;
overflow:hidden;
}

/* CAROUSEL */
.carousel{
position:relative;
overflow:hidden;
height:220px;
}

.slides{
display:flex;
transition:transform .5s ease;
}

.slides img{
min-width:100%;
height:220px;
object-fit:cover;
}

.btn{
position:absolute;
top:50%;
transform:translateY(-50%);
background:rgba(0,0,0,.5);
color:white;
border:none;
width:35px;
height:35px;
border-radius:50%;
cursor:pointer;
}

.prev{left:10px;}
.next{right:10px;}

.content{
padding:15px;
}

textarea{
width:100%;
height:80px;
border:none;
background:#000;
color:white;
padding:10px;
border-radius:10px;
}

button{
margin-top:10px;
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
}

.review{
background:#000;
padding:10px;
margin-top:10px;
border-radius:10px;
}

/* MAP */
#map{
height:500px;
margin:30px;
border-radius:20px;
}
</style>
</head>

<body>

<nav>
<h2>LuxuryStay</h2>
<input id="search" placeholder="Buscar hotel o ciudad">
</nav>

<div class="hero">
<h1>Luxury Hotels Colombia</h1>
<p>Descubre hoteles premium</p>
</div>

<section>
<div id="hotels" class="grid"></div>
</section>

<section>
<div id="map"></div>
</section>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/* =======================
   HOTELES
======================= */

const hotels = [

{
name:"Grand Hyatt Bogotá",
city:"Bogotá",
contact:"[PONER CONTACTO]",
address:"[PONER DIRECCIÓN]",
coords:[4.711,-74.072],
images:[
"https://images.unsplash.com/photo-1542314831-068cd1dbfeeb",
"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267",
"https://images.unsplash.com/photo-1551882547-ff40c63fe5fa"
]
},

{
name:"The Click Clack Hotel",
city:"Medellín",
contact:"[PONER CONTACTO]",
address:"[PONER DIRECCIÓN]",
coords:[6.244,-75.581],
images:[
"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85",
"https://images.unsplash.com/photo-1445019980597-93fa8acb246c"
]
},

{
name:"Hotel Dubai Cartagena",
city:"Cartagena",
contact:"[PONER CONTACTO]",
address:"[PONER DIRECCIÓN]",
coords:[10.391,-75.479],
images:[
"https://images.unsplash.com/photo-1578683010236-d716f9a3f461",
"https://images.unsplash.com/photo-1522798514-97ceb8c4f1c8"
]
},

{
name:"Marriott Santa Marta",
city:"Santa Marta",
contact:"[PONER CONTACTO]",
address:"[PONER DIRECCIÓN]",
coords:[11.240,-74.199],
images:[
"https://images.unsplash.com/photo-1455587734955-081b22074882",
"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85"
]
}

];

/* =======================
   RENDER HOTELS
======================= */

const container=document.getElementById("hotels");

let indexSlide={};

function render(){

container.innerHTML="";

hotels.forEach((h,i)=>{

container.innerHTML+=`

<div class="card">

<div class="carousel">

<div class="slides" id="s${i}">
${h.images.map(img=>`<img src="${img}">`).join("")}
</div>

<button class="btn prev" onclick="move(${i},-1)">‹</button>
<button class="btn next" onclick="move(${i},1)">›</button>

</div>

<div class="content">

<h3>${h.name}</h3>
<p>${h.city}</p>

<p>${h.address}</p>
<p>${h.contact}</p>

<select id="r${i}">
<option>⭐1</option>
<option>⭐2</option>
<option>⭐3</option>
<option>⭐4</option>
<option selected>⭐5</option>
</select>

<textarea id="t${i}" placeholder="Escribe reseña"></textarea>

<button onclick="addReview(${i})">Publicar</button>

<div id="rev${i}"></div>

</div>

</div>

`;

loadReviews(i);

});

}

function move(i,d){

if(!indexSlide[i]) indexSlide[i]=0;

indexSlide[i]+=d;

if(indexSlide[i]<0) indexSlide[i]=hotels[i].images.length-1;
if(indexSlide[i]>=hotels[i].images.length) indexSlide[i]=0;

document.getElementById("s"+i).style.transform=
`translateX(-${indexSlide[i]*100}%)`;

}

/* =======================
   RESEÑAS
======================= */

function addReview(i){

let text=document.getElementById("t"+i).value;
let star=document.getElementById("r"+i).value;

let key=hotels[i].name;

let data=JSON.parse(localStorage.getItem(key)||"[]");

data.push({text,star});

localStorage.setItem(key,JSON.stringify(data));

loadReviews(i);

document.getElementById("t"+i).value="";

}

function loadReviews(i){

let key=hotels[i].name;

let data=JSON.parse(localStorage.getItem(key)||"[]");

let box=document.getElementById("rev"+i);

box.innerHTML="";

data.forEach(r=>{
box.innerHTML+=`
<div class="review">
${r.star}<br>${r.text}
</div>
`;
});

}

/* =======================
   MAPA (CORREGIDO)
======================= */

const map = L.map('map').setView([4.5709,-74.2973],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map);

hotels.forEach(h=>{

L.marker(h.coords)
.addTo(map)
.bindPopup(`<b>${h.name}</b><br>${h.city}`);

});

render();

</script>

</body>
</html>
